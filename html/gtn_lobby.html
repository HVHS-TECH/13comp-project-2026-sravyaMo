<!DOCTYPE html>
<html lang="en">
<head>
  <title>Welocme to my Guess the Number Lobby</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- stylesheets *******************************************-->
  <link rel="stylesheet" href="../css/lobby.css">
 
  <!-- P5.js & P5.play ***************************************-->

  <script src="https://q5js.org/q5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/addons/p5.sound.js" integrity="sha512-TU9AWtV5uUZPX8dbBAH8NQF1tSdigPRRT82vllAQ1Ke28puiqLA6ZVKxtUGlgrH6yWFnkKy+sE6luNEGH9ar0A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://p5play.org/v3/planck.min.js"></script>
  <script src="https://p5play.org/v3/p5play.js"></script>
  
  <!-- JQUERY ************************************************-->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  
</head>

<!--*************************************************************
  BODY
**************************************************************-->
<body>
<div class="main-layout">
 <div class="wrapper">
  <h1>Guess the Number Lobby</h1>

  <p>Create or join a server!</p>

  <div class="lobby-buttons">
    <button id="createBtn">Create a server</button>
    <button id="joinBtn">Join a server</button>
  </div>
  
 </div>

 <!-- The create/join popup(seems easier than adding another page) ************************************************-->
 <div class="popup hidden">

  <div class="popup-box">

    <h2 id="popupTitle">Create a server</h2>
    <input type="text" id="serverInput" maxlength="12" placeholder="Enter server name here">

    <p class="popup-message"></p>

    <div class="popup-buttons">
      <button id="submitBtn">Submit</button> 
      <button id="closeBtn">Close</button>
    </div>

  </div>

  <div class="lobby-list-panel">

  <h2>Available Lobbies</h2>

  <div id="lobbyList"></div>

  
  </div>
</div>
 </div>
    
<script type="module" src="../module/gtn_lobby.mjs"></script>
</body>
</html>
<!--*************************************************************
  END OF INDEX.HTML
**************************************************************-->
